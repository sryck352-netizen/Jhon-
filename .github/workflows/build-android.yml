name: Compilar e publicar JHON APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK Android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validar e renomear APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk JHON.apk
          unzip -t JHON.apk | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: JHON-APK-teste
          path: JHON.apk
          if-no-files-found: error
      - name: Publicar release para download direto pelo Chrome
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.1 >/dev/null 2>&1; then
            gh release upload v2.0.1 JHON.apk --clobber
          else
            gh release create v2.0.1 JHON.apk --target "$GITHUB_SHA" --title "JHON Android v2.0.1 (teste)" --notes "APK Android de teste com voz, texto e tarefas no GitHub. Não é um criador autônomo de jogos sem configuração de um agente. Assinado com chave de depuração."
          fi
