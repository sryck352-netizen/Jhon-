name: Compilar Merlin APK
on:
  push:
    branches: [merlin]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK de teste
        run: cd Merlin && gradle --no-daemon assembleDebug
      - name: Renomear APK
        run: cp Merlin/app/build/outputs/apk/debug/app-debug.apk Merlin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Merlin-Android
          path: Merlin.apk

      - name: Disponibilizar APK para download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create merlin-v1.0.0 Merlin.apk \
            --title "Merlin 1.0 — Android" \
            --notes "Merlin 1.0: player musical offline para Android, com importação de arquivos, playlists, favoritos e reprodução em segundo plano." \
            --target "$GITHUB_SHA"
