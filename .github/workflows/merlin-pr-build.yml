name: Compilar Merlin APK (validação)
on:
  pull_request:
    branches: [merlin]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar Android SDK 35
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - name: Compilar APK
        run: cd Merlin && gradle --no-daemon assembleDebug
      - name: Renomear APK
        run: cp Merlin/app/build/outputs/apk/debug/app-debug.apk Merlin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Merlin-Android
          path: Merlin.apk
