plugins { id 'com.android.application' }

android {
    namespace 'com.merlin.player'
    compileSdk 35
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId 'com.merlin.player'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.6.0'
        def jamendoId = (System.getenv('MERLIN_JAMENDO_CLIENT_ID') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField "String", "JAMENDO_CLIENT_ID", '"' + jamendoId + '"'
        // Configuração pública do Firebase. A build sem as variáveis fica no modo offline.
        def webKey = (System.getenv('MERLIN_FIREBASE_API_KEY') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        def url = (System.getenv('MERLIN_FIREBASE_DATABASE_URL') ?: '').replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField "String", "FIREBASE_API_KEY", '"' + webKey + '"'
        buildConfigField "String", "FIREBASE_DATABASE_URL", '"' + url + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


// Materializa o ícone fornecido pelo usuário diretamente da imagem incorporada ao projeto.
def merlinIconBase64 = file('../merlin_icon.base64')
def merlinIconOutput = file('src/main/res/drawable-nodpi/merlin_icon.jpg')
if (merlinIconBase64.isFile()) {
    merlinIconOutput.parentFile.mkdirs()
    merlinIconOutput.bytes = java.util.Base64.getMimeDecoder().decode(merlinIconBase64.text)
}
